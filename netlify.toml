[build]
publish = "."
command = ""

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[build.environment]
NODE_VERSION = "18"

# Preserve the API endpoint. Static HTML pages are served directly.
[[redirects]]
from = "/api/ai"
to = "/.netlify/functions/ai"
status = 200

# Do not rewrite unknown URLs to the homepage with HTTP 200.
# Netlify should return its normal 404 response for missing pages.
